name: Deploy to Amazon ECR

on:
  push:
    branches: [main]

jobs:
  build-nextjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.json') }}

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: next-build-${{ github.sha }}
          retention-days: 5
          path: |
            .next/standalone/*
            .next/static/*
            public/*

  build-docker:
    needs: [build-nextjs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Extract version from package.json
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: next-build-${{ github.sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Docker Image to Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
          IMAGE_TAG: ${{ steps.package-version.outputs.current-version }}
        run: |
          # Docker Hub 리포지토리 이름 설정 (username/repository)
          REPO_NAME="$DOCKER_HUB_USERNAME/my-nextjs"

          # 태그가 비어있다면 latest로 설정
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="latest"
          fi

          echo "Using image tag: $IMAGE_TAG"

          # Docker 빌드 (Context = current directory)
          docker build -t $REPO_NAME:$IMAGE_TAG .

          # Latest 태그도 붙일 경우
          docker tag $REPO_NAME:$IMAGE_TAG $REPO_NAME:latest

          # 푸시
          docker push $REPO_NAME:$IMAGE_TAG
          docker push $REPO_NAME:latest
